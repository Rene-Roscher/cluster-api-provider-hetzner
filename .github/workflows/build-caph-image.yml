name: build-caph-image

# Builds the CAPH controller image from this fork (with server recycling) and pushes it to GHCR.
# Lives on the deploy/caph-image branch so it does not pollute the upstream PR branch.

on:
  push:
    branches: [deploy/caph-image]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/caph/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/rene-roscher/cluster-api-provider-hetzner:recycling
            ghcr.io/rene-roscher/cluster-api-provider-hetzner:${{ github.sha }}
